[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Asanali111/wevex-rs"
authors = ["Asanali Omar"]

[workspace.dependencies]
wevex-core = { path = "crates/core" }
wevex-embed = { path = "crates/embed" }
wevex-mcp = { path = "crates/mcp" }
wevex-watchers = { path = "crates/watchers" }
wevex-service = { path = "crates/service" }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
fs4 = { version = "0.13", features = ["sync"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# 0.22 because candle-core 0.11 depends on it (with the C `onig` regex);
# a second, pure-Rust 0.23 would only add a duplicate copy.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
ureq = "3"
sha2 = "0.11"

# Dependencies (candle, tokenizers, SQLite) optimised even in dev and test
# builds: model inference unoptimised is unusably slow, and this avoids the
# long LTO release build just to run tests.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
